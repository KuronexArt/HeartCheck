services:
  heartcheck:
    build: .
    container_name: HeartCheck
    restart: unless-stopped
    ports:
      - "8788:8787"
    environment:
      VIEW_KEY: "여기에_확인용_키"        # 여자친구가 사이트에 넣는 키
      DEVICE_KEY: "여기에_기기용_키"      # 아이폰 앱에 넣는 키
      SESSION_MINUTES: "5"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: HeartCheck_Tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://heartcheck:8787
    depends_on:
      - heartcheck
