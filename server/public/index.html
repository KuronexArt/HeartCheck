<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HeartCheck</title>
<style>
  :root { --bg:#0d0b14; --card:#17141f; --line:#2a2536; --text:#f2eef8; --dim:#8d86a0; --heart:#ff4d79; --ok:#5ee0b0; --warn:#ffb85c; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:max(24px,env(safe-area-inset-top)) 20px 32px; gap:20px; }
  h1 { font-size:15px; font-weight:600; color:var(--dim); letter-spacing:.08em; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:28px 24px; text-align:center; }
  .bpm { display:flex; align-items:baseline; justify-content:center; gap:8px; margin:6px 0 2px; }
  .bpm b { font-size:88px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
  .bpm span { color:var(--dim); font-size:18px; }
  .heart { width:34px; height:34px; color:var(--heart); margin:0 auto 6px; }
  .heart.beat { animation:beat .9s ease-in-out infinite; }
  @keyframes beat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.22)} 30%{transform:scale(1)} 45%{transform:scale(1.12)} }
  .ago { color:var(--dim); font-size:13px; min-height:18px; }
  svg.spark { width:100%; height:70px; margin-top:18px; }
  .status { display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; color:var(--dim); margin-top:14px; min-height:20px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); animation:pulse 1s infinite; } .dot.err { background:var(--heart); }
  @keyframes pulse { 50% { opacity:.3 } }
  button { width:100%; max-width:420px; border:0; border-radius:18px; padding:18px; font-size:17px; font-weight:700; font-family:inherit; cursor:pointer; }
  #go { background:var(--heart); color:#fff; } #go:disabled { opacity:.5; }
  #stop { background:transparent; color:var(--dim); border:1px solid var(--line); padding:12px; font-size:14px; font-weight:500; }
  .hint { color:var(--dim); font-size:12px; max-width:420px; text-align:center; line-height:1.6; }
</style>
</head>
<body>
  <h1>HEARTCHECK</h1>
  <div class="card">
    <svg class="heart" id="heart" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3.1 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.7 0 5.9 3.8 4.4 7.2C19.5 16.4 12 21 12 21z"/></svg>
    <div class="bpm"><b id="bpm">--</b><span>BPM</span></div>
    <div class="ago" id="ago"></div>
    <svg class="spark" id="spark" viewBox="0 0 300 70" preserveAspectRatio="none"></svg>
    <div class="status"><i class="dot" id="dot"></i><span id="status">연결 중…</span></div>
  </div>
  <button id="go">지금 심박 확인하기</button>
  <button id="stop" hidden>측정 그만하기</button>
  <p class="hint" id="hint">버튼을 누르면 워치가 몇 분 동안 심박을 재서 실시간으로 보여줘요.</p>

<script>
const params = new URLSearchParams(location.search);
let key = params.get('k') || localStorage.getItem('hc_key') || '';
if (params.get('k')) { localStorage.setItem('hc_key', key); history.replaceState(null, '', location.pathname); }
if (!key) { key = prompt('확인 키를 입력하세요') || ''; localStorage.setItem('hc_key', key); }

const $ = (id) => document.getElementById(id);
let st = {}, hist = [], skew = 0;

const PHASE = {
  idle:       ['', '대기 중'],
  requested:  ['warn', '아이폰 깨우는 중…'],
  phone_woke: ['warn', '워치 측정 시작하는 중…'],
  measuring:  ['ok', '실시간 측정 중'],
  ended:      ['', '측정 끝'],
  error:      ['err', '문제가 생겼어요'],
};

function render() {
  const now = Date.now() + skew;
  const hr = st.lastHr;
  const fresh = hr && now - hr.ts < 15000;
  $('bpm').textContent = hr ? hr.bpm : '--';
  $('bpm').style.opacity = fresh ? 1 : .45;
  $('heart').classList.toggle('beat', !!fresh);
  if (hr) $('heart').style.animationDuration = (60 / hr.bpm).toFixed(2) + 's';
  $('ago').textContent = hr ? agoText(now - hr.ts) : '';

  let phase = st.phase || 'idle';
  if (phase === 'measuring' && !fresh) phase = 'ended';
  // 요청 후 40초 지나도 응답 없으면 안내
  if ((phase === 'requested' || phase === 'phone_woke') && now - st.phaseAt > 40000) {
    $('dot').className = 'dot err';
    $('status').textContent = phase === 'requested' ? '아이폰이 응답하지 않아요' : '워치가 응답하지 않아요';
  } else {
    const [cls, label] = PHASE[phase] || PHASE.idle;
    $('dot').className = 'dot ' + cls;
    $('status').textContent = label + (phase === 'error' && st.phaseDetail ? ` · ${st.phaseDetail}` : '');
  }
  const active = now < (st.keepUntil || 0);
  $('stop').hidden = !active;
  $('go').textContent = active ? `측정 연장하기 (${Math.ceil((st.keepUntil - now) / 60000)}분 남음)` : '지금 심박 확인하기';
  drawSpark();
}
function agoText(ms) {
  const s = Math.round(ms / 1000);
  if (s < 5) return '방금';
  if (s < 60) return `${s}초 전`;
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  return new Date(Date.now() - ms).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function drawSpark() {
  const pts = hist.slice(-90);
  if (pts.length < 2) { $('spark').innerHTML = ''; return; }
  const vals = pts.map(p => p.bpm);
  const lo = Math.min(...vals) - 5, hi = Math.max(...vals) + 5;
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1) * 300).toFixed(1)},${(66 - (p.bpm - lo) / (hi - lo) * 62).toFixed(1)}`).join('');
  $('spark').innerHTML = `<path d="${d}" fill="none" stroke="var(--heart)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
}

function connect() {
  const es = new EventSource('/api/stream?k=' + encodeURIComponent(key));
  es.addEventListener('status', e => { st = JSON.parse(e.data); skew = st.now - Date.now(); render(); });
  es.addEventListener('history', e => { hist = JSON.parse(e.data); render(); });
  es.addEventListener('hr', e => { const s = JSON.parse(e.data); hist.push(s); if (hist.length > 300) hist.shift(); st.lastHr = s; render(); });
  es.onerror = () => { $('dot').className = 'dot err'; $('status').textContent = '서버 연결 끊김 — 다시 연결 중…'; };
}

async function post(path) {
  const r = await fetch(path, { method: 'POST', headers: { 'x-key': key } });
  if (r.status === 401) { localStorage.removeItem('hc_key'); alert('키가 틀렸어요. 새로고침해서 다시 입력하세요.'); }
  return r;
}
$('go').onclick = async () => { $('go').disabled = true; try { await post('/api/request'); } finally { setTimeout(() => $('go').disabled = false, 3000); } };
$('stop').onclick = () => post('/api/stop');

setInterval(render, 1000);
connect();
</script>
</body>
</html>
