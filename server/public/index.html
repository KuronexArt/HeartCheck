<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HeartCheck</title>
<style>
  :root { --bg:#0d0b14; --card:#17141f; --line:#2a2536; --text:#f2eef8; --dim:#8d86a0; --heart:#ff4d79; --ok:#5ee0b0; --warn:#ffb85c; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:max(24px,env(safe-area-inset-top)) 20px 32px; gap:18px; }
  h1 { font-size:15px; font-weight:600; color:var(--dim); letter-spacing:.08em; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:28px 24px; text-align:center; }
  .heart { width:34px; height:34px; color:var(--dim); margin:0 auto 6px; }
  .heart.on { color:var(--heart); animation:beat .9s ease-in-out infinite; }
  @keyframes beat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.22)} 30%{transform:scale(1)} 45%{transform:scale(1.12)} }
  .bpm { display:flex; align-items:baseline; justify-content:center; gap:8px; }
  .bpm b { font-size:88px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
  .bpm span { color:var(--dim); font-size:18px; }
  .sub { color:var(--dim); font-size:13px; min-height:18px; margin-top:4px; }
  svg.spark { width:100%; height:70px; margin-top:16px; }
  .status { display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; color:var(--dim); margin-top:14px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); flex:none; }
  .dot.ok { background:var(--ok); } .dot.live { background:var(--heart); animation:pulse 1s infinite; } .dot.off { background:#555; }
  @keyframes pulse { 50% { opacity:.3 } }
  button { width:100%; max-width:420px; border:0; border-radius:18px; padding:18px; font-size:17px; font-weight:700; font-family:inherit; cursor:pointer; }
  #go { background:var(--heart); color:#fff; } #go:disabled { opacity:.4; cursor:default; }
  #stop { background:transparent; color:var(--dim); border:1px solid var(--line); padding:12px; font-size:14px; font-weight:500; }
  .hint { color:var(--dim); font-size:12px; max-width:420px; text-align:center; line-height:1.6; }
</style>
</head>
<body>
  <h1>HEARTCHECK</h1>
  <div class="card">
    <svg class="heart" id="heart" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3.1 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.7 0 5.9 3.8 4.4 7.2C19.5 16.4 12 21 12 21z"/></svg>
    <div class="bpm"><b id="bpm">--</b><span>BPM</span></div>
    <div class="sub" id="sub"></div>
    <svg class="spark" id="spark" viewBox="0 0 300 70" preserveAspectRatio="none"></svg>
    <div class="status"><i class="dot" id="dot"></i><span id="status">연결 중…</span></div>
  </div>
  <button id="go">측정 시작</button>
  <button id="stop" hidden>측정 중지</button>
  <p class="hint">버튼을 누르면 10초 안에 워치가 실시간 측정을 시작하고, 5분 뒤 자동으로 멈춰요.</p>
<script>
const qs = new URLSearchParams(location.search);
let key = qs.get('k') || localStorage.getItem('hc_key') || '';
if (qs.get('k')) { localStorage.setItem('hc_key', key); history.replaceState(null, '', location.pathname); }
if (!key) { key = prompt('확인 키를 입력하세요') || ''; localStorage.setItem('hc_key', key); }

const $ = (id) => document.getElementById(id);
let st = {}, hist = [], skew = 0, pending = 0;

function render() {
  const now = Date.now() + skew;
  const active = now < (st.keepUntil || 0);
  const online = st.lastSeen && now - st.lastSeen < 40000;
  const hr = st.lastHr;
  const fresh = hr && now - hr.ts < 10000;

  $('bpm').textContent = hr ? hr.bpm : '--';
  $('bpm').style.opacity = active && fresh ? 1 : .35;
  $('heart').classList.toggle('on', !!(active && fresh));
  if (hr) $('heart').style.animationDuration = (60 / hr.bpm).toFixed(2) + 's';

  let dot = 'off', text = '워치가 꺼져 있어요 — 워치에서 HeartCheck를 열어주세요';
  if (active) {
    const s = Math.max(0, Math.ceil((st.keepUntil - now) / 1000));
    if (fresh) { dot = 'live'; text = `실시간 측정 중 · ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} 남음`; }
    else { dot = 'ok'; text = '워치에 요청 전달 중… (최대 10초)'; }
  } else if (online) { dot = 'ok'; text = '워치 대기 중 · 버튼을 누르면 측정해요'; }
  $('dot').className = 'dot ' + dot;
  $('status').textContent = text;
  $('sub').textContent = hr && !active ? `마지막 측정 ${ago(now - hr.ts)}` : '';

  $('go').hidden = active; $('stop').hidden = !active;
  $('go').disabled = !online || now < pending;
  drawSpark();
}
function ago(ms) {
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}초 전`;
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  return new Date(Date.now() - ms).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function drawSpark() {
  const pts = hist.slice(-150);
  if (pts.length < 2) { $('spark').innerHTML = ''; return; }
  const v = pts.map(p => p.bpm), lo = Math.min(...v) - 5, hi = Math.max(...v) + 5;
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1) * 300).toFixed(1)},${(66 - (p.bpm - lo) / (hi - lo) * 62).toFixed(1)}`).join('');
  $('spark').innerHTML = `<path d="${d}" fill="none" stroke="var(--heart)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
}
function connect() {
  const es = new EventSource('/api/stream?k=' + encodeURIComponent(key));
  es.addEventListener('status', e => { st = JSON.parse(e.data); skew = st.now - Date.now(); render(); });
  es.addEventListener('history', e => { hist = JSON.parse(e.data); render(); });
  es.addEventListener('hr', e => { const s = JSON.parse(e.data); hist.push(s); if (hist.length > 600) hist.shift(); st.lastHr = s; st.lastSeen = s.ts; render(); });
  es.onerror = () => { $('dot').className = 'dot off'; $('status').textContent = '서버 연결 끊김 — 다시 연결 중…'; };
}
async function post(path) {
  const r = await fetch(path, { method: 'POST', headers: { 'x-key': key } });
  if (r.status === 401) { localStorage.removeItem('hc_key'); alert('키가 틀렸어요. 새로고침해서 다시 입력하세요.'); }
  if (r.status === 409) alert('워치가 대기 중이 아니에요. 워치에서 HeartCheck를 열어주세요.');
  return r;
}
$('go').onclick = async () => { pending = Date.now() + 3000; render(); await post('/api/request'); };
$('stop').onclick = () => post('/api/stop');
setInterval(render, 1000);
connect();
</script>
</body>
</html>
