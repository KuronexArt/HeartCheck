name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: app
        run: xcodegen
      - name: Build (iOS app + embedded watch app)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project HeartCheck.xcodeproj -scheme HeartCheck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/HeartCheck.app
      - name: Package IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HeartCheck.app Payload/
          ls Payload/HeartCheck.app/Watch || echo "warning: watch app not embedded"
          # 서명 도구(plumesign)가 필요한 권한(HealthKit)을 알 수 있게 권한만 넣어 임시 서명
          codesign -f -s - --entitlements Watch/HeartCheckWatch.entitlements Payload/HeartCheck.app/Watch/HeartCheckWatch.app
          codesign -f -s - --entitlements iOS/HeartCheck.entitlements Payload/HeartCheck.app
          codesign -d --entitlements - Payload/HeartCheck.app/Watch/HeartCheckWatch.app | head -20
          zip -qry HeartCheck-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HeartCheck-unsigned-ipa
          path: app/HeartCheck-unsigned.ipa
      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest app/HeartCheck-unsigned.ipa \
            --title "HeartCheck (latest build)" \
            --notes "Commit ${GITHUB_SHA::7} — 서명 안 된 IPA. Sideloadly 등으로 설치." \
            --target "$GITHUB_SHA"
