name: Build

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: app
        run: xcodegen
      - name: Build watchOS app
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project HeartCheck.xcodeproj -scheme HeartCheckWatch \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 80
      - name: Build iOS app (embeds watch app)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project HeartCheck.xcodeproj -scheme HeartCheck \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 80
